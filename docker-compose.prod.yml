# =============================================================================
# docker-compose.prod.yml — 本番環境用
# =============================================================================
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# - -f を明示するため docker-compose.override.yml（開発用）は読み込まれない
#   → ホストへのポート公開なし・開発用マウントなし・デバッグ機能なし
# - cloudflared コンテナ経由（Cloudflare Tunnel）でのみアクセス可能
# - フロントエンドはビルド済み静的ファイルを nginx（:8080）で配信
# =============================================================================

services:
  # --- Database ---
  db:
    restart: unless-stopped

  # --- Backend API ---
  backend:
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS を .env.production に設定してください}

  # --- Frontend ---
  frontend:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL を .env.production に設定してください}

  # --- Cloudflare Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN を .env.production に設定してください}
    depends_on:
      - backend
      - frontend
