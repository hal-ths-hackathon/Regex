# =============================================================================
# docker-compose.override.yml — 開発環境用（`docker compose up` で自動的に読み込まれる）
# =============================================================================
# ポートは 127.0.0.1 にのみ公開し、LAN / インターネットからは届かないようにする。
# 本番では `-f docker-compose.yml -f docker-compose.prod.yml` を指定するため、
# このファイルは読み込まれない。
# =============================================================================
services:
  db:
    ports:
      - "127.0.0.1:5439:5432"

  backend:
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENABLE_DEV_TOOLS=true

  frontend:
    build:
      target: dev
    ports:
      - "127.0.0.1:3000:5173"
